name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q location.py
      - run: sh -n setup.sh
